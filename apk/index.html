<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#6366f1">
    <title>起飞助手</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <main id="main-content">
        </main>
        
        <nav id="bottom-nav">
            <button class="nav-item active" data-tab="add">
                <span class="nav-icon">➕</span>
                <span class="nav-label" data-i18n="tab_add">添加</span>
            </button>
            <button class="nav-item" data-tab="records">
                <span class="nav-icon">📋</span>
                <span class="nav-label" data-i18n="tab_records">记录</span>
            </button>
            <button class="nav-item" data-tab="stats">
                <span class="nav-icon">📊</span>
                <span class="nav-label" data-i18n="tab_stats">分析</span>
            </button>
            <button class="nav-item" data-tab="settings">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label" data-i18n="tab_settings">设置</span>
            </button>
        </nav>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="pdf.min.js"></script>
    <script>if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='';</script>
    <script src="app.js?v=13"></script>
